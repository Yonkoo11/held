[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# Hedera's EVM trails mainnet. Shanghai is the safe floor: it has PUSH0, which solc 0.8.26 emits,
# without relying on Cancun opcodes the relay may not accept.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
