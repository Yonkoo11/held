<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OutcomeLock</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #16181d; --muted: #5f646e; --line: #e3e3df;
    --held: #9a6b00; --held-bg: #fdf3dc; --ok: #1c6b3f; --ok-bg: #e4f3ea;
    --no: #a32b20; --no-bg: #fbe9e7; --accent: #2b4acb;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111317; --panel: #181b21; --ink: #e9eaec; --muted: #969ba6; --line: #272b33;
      --held: #e0b04a; --held-bg: #2e2616; --ok: #6fd398; --ok-bg: #12281c;
      --no: #f08b80; --no-bg: #2c1614; --accent: #8ba4ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 25px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .tag { color: var(--muted); font-size: 14px; margin: 0; }
  .tiers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em;
          padding: 6px 9px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
  .chip.degraded { color: var(--held); background: var(--held-bg); border-color: transparent; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea { width: 100%; min-height: 72px; resize: vertical; padding: 11px 12px; font: inherit;
             border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
  button { font: inherit; font-weight: 550; padding: 9px 15px; border-radius: 7px; cursor: pointer;
           border: 1px solid transparent; background: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 13px; }
  .price { font: 12px var(--mono); color: var(--muted); }
  .job { border-top: 1px solid var(--line); padding-top: 15px; margin-top: 15px; }
  .job:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .jobhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .q { font-weight: 550; }
  .state { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em;
           padding: 5px 8px; border-radius: 5px; white-space: nowrap; }
  .state.held { background: var(--held-bg); color: var(--held); }
  .state.released { background: var(--ok-bg); color: var(--ok); }
  .state.refunded { background: var(--no-bg); color: var(--no); }
  pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 var(--mono);
        background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
        padding: 12px; margin: 11px 0; overflow-x: auto; }
  .meta { font: 11.5px var(--mono); color: var(--muted); margin-top: 8px; }
  .meta a { color: var(--accent); }
  .clock { font: 11.5px var(--mono); color: var(--held); }
  .trail { margin-top: 10px; font: 11.5px/1.7 var(--mono); color: var(--muted); }
  .trail div { display: flex; gap: 9px; }
  .trail b { color: var(--ink); font-weight: 550; min-width: 130px; }
  .empty { color: var(--muted); font-size: 14px; }
  .err { color: var(--no); font-size: 13.5px; margin-top: 9px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OutcomeLock</h1>
    <p class="tag">You pay up front. The money waits in escrow until you have read what the agent
      actually produced.</p>
    <div class="tiers" id="tiers"></div>
  </header>

  <div class="card">
    <label for="q">Ask the agent something</label>
    <textarea id="q" placeholder="Explain what a Hedera scheduled transaction is and when it executes."></textarea>
    <div class="row">
      <button id="go">Pay and ask</button>
      <span class="price" id="price"></span>
    </div>
    <div class="err" id="err" hidden></div>
  </div>

  <div class="card">
    <div id="jobs"><p class="empty">No jobs yet.</p></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let priceInfo = null;

// The claim token proves you are the buyer for a job. It is shown once, so the page keeps it.
// Per-browser only: open the page elsewhere and you cannot decide on these jobs, which is the point.
const TOKENS = 'outcomelock.tokens';
function readTokens() {
  try { return JSON.parse(localStorage.getItem(TOKENS) || '{}'); } catch { return {}; }
}
function saveToken(jobId, token) {
  try { const t = readTokens(); t[jobId] = token; localStorage.setItem(TOKENS, JSON.stringify(t)); } catch {}
}

// Everything below builds DOM nodes and sets textContent. Nothing here concatenates HTML, because
// the question comes from a user and the deliverable comes from a model — both are attacker
// controlled, and an escape helper is one forgotten call away from being wrong.
function el(tag, props = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('data-')) n.setAttribute(k, v);
    else n[k] = v;
  }
  for (const c of [].concat(children)) if (c) n.appendChild(c);
  return n;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

async function loadHealth() {
  const h = await (await fetch('/health')).json();
  $('price').textContent = `${h.price} ${h.asset.symbol} per request · escrow ${h.escrow}`;
  const box = $('tiers');
  clear(box);
  for (const [k, v] of Object.entries(h.tiers || {})) {
    box.appendChild(el('span', { class: `chip ${v.degraded ? 'degraded' : ''}`, text: `${k}: ${v.label}` }));
  }
}

function countdown(deadline) {
  const left = deadline - Date.now();
  if (left <= 0) return 'releasing…';
  const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
  return `auto-releases in ${m}m ${String(s).padStart(2, '0')}s`;
}

function jobNode(j) {
  const mine = Boolean(readTokens()[j.id]);
  const head = el('div', { class: 'jobhead' }, [
    el('span', { class: 'q', text: j.question }),
    el('span', { class: `state ${j.state}`, text: j.state }),
  ]);

  const meta = el('div', { class: 'meta',
    text: `${j.amountDisplay} ${j.assetSymbol || ''} · agent ${j.agentVersion || ''} · tier ${j.workerTier || ''}` });

  const parts = [head, meta];
  if (j.state === 'held') {
    parts.push(el('div', { class: 'clock', 'data-deadline': String(j.deadline), text: countdown(j.deadline) }));
  }
  parts.push(el('pre', { text: j.deliverable || '' }));

  if (j.state === 'held' && mine) {
    parts.push(el('div', { class: 'row' }, [
      el('button', { 'data-act': 'approve', 'data-id': j.id, text: 'Approve — pay the seller' }),
      el('button', { class: 'ghost', 'data-act': 'reject', 'data-id': j.id, text: 'Reject — refund me' }),
    ]));
  } else if (j.state === 'held') {
    parts.push(el('div', { class: 'meta', text: 'paid for in another browser — only the buyer who paid can decide' }));
  } else {
    const tail = [j.decisionReason, j.decisionTx].filter(Boolean).join(' · ');
    parts.push(el('div', { class: 'meta', text: tail }));
  }

  const trail = el('div', { class: 'trail' });
  for (const e of j.evidence || []) {
    trail.appendChild(el('div', {}, [
      el('b', { text: e.type }),
      el('span', { text: new Date(e.at).toLocaleTimeString() }),
    ]));
  }
  parts.push(trail);
  return el('div', { class: 'job' }, parts);
}

async function loadJobs() {
  const list = await (await fetch('/jobs')).json();
  const box = $('jobs');
  if (!list.length) { clear(box); box.appendChild(el('p', { class: 'empty', text: 'No jobs yet.' })); return; }
  const full = await Promise.all(list.slice(0, 8).map((j) => fetch(`/jobs/${encodeURIComponent(j.id)}`).then((r) => r.json())));
  clear(box);
  for (const j of full) box.appendChild(jobNode(j));
}

$('go').addEventListener('click', async () => {
  const question = $('q').value.trim();
  if (!question) return;
  $('go').disabled = true; $('go').textContent = 'Paying…'; $('err').hidden = true;
  try {
    const r = await fetch('/demo/buy', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || `failed (${r.status})`);
    if (b.claimToken) saveToken(b.jobId, b.claimToken);
    $('q').value = '';
    await loadJobs();
  } catch (e) {
    $('err').textContent = e.message; $('err').hidden = false;
  } finally {
    $('go').disabled = false; $('go').textContent = 'Pay and ask';
  }
});

$('jobs').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-act]');
  if (!b) return;
  b.disabled = true;
  const res = await fetch(`/jobs/${b.dataset.id}/${b.dataset.act}`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'X-Job-Token': readTokens()[b.dataset.id] || '' },
    body: JSON.stringify({ reason: b.dataset.act === 'approve' ? 'looks right' : 'not what I asked for' }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    $('err').textContent = e.error || `could not ${b.dataset.act}`; $('err').hidden = false;
  }
  await loadJobs();
});

setInterval(() => {
  document.querySelectorAll('.clock[data-deadline]').forEach((el) => {
    el.textContent = countdown(Number(el.dataset.deadline));
  });
}, 1000);
setInterval(loadJobs, 6000);

loadHealth().then(loadJobs);
</script>
</body>
</html>
