<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OutcomeLock</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #16181d; --muted: #5f646e; --line: #e3e3df;
    --held: #9a6b00; --held-bg: #fdf3dc; --ok: #1c6b3f; --ok-bg: #e4f3ea;
    --no: #a32b20; --no-bg: #fbe9e7; --accent: #2b4acb;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111317; --panel: #181b21; --ink: #e9eaec; --muted: #969ba6; --line: #272b33;
      --held: #e0b04a; --held-bg: #2e2616; --ok: #6fd398; --ok-bg: #12281c;
      --no: #f08b80; --no-bg: #2c1614; --accent: #8ba4ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 25px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .tag { color: var(--muted); font-size: 14px; margin: 0; }
  .tiers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em;
          padding: 6px 9px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
  .chip.degraded { color: var(--held); background: var(--held-bg); border-color: transparent; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea { width: 100%; min-height: 72px; resize: vertical; padding: 11px 12px; font: inherit;
             border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
  button { font: inherit; font-weight: 550; padding: 9px 15px; border-radius: 7px; cursor: pointer;
           border: 1px solid transparent; background: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 13px; }
  .price { font: 12px var(--mono); color: var(--muted); }
  .job { border-top: 1px solid var(--line); padding-top: 15px; margin-top: 15px; }
  .job:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .jobhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .q { font-weight: 550; }
  .state { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em;
           padding: 5px 8px; border-radius: 5px; white-space: nowrap; }
  .state.held { background: var(--held-bg); color: var(--held); }
  .state.released { background: var(--ok-bg); color: var(--ok); }
  .state.refunded { background: var(--no-bg); color: var(--no); }
  pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 var(--mono);
        background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
        padding: 12px; margin: 11px 0; overflow-x: auto; }
  .meta { font: 11.5px var(--mono); color: var(--muted); margin-top: 8px; }
  .meta a { color: var(--accent); }
  .clock { font: 11.5px var(--mono); color: var(--held); }
  .trail { margin-top: 10px; font: 11.5px/1.7 var(--mono); color: var(--muted); }
  .trail div { display: flex; gap: 9px; }
  .trail b { color: var(--ink); font-weight: 550; min-width: 130px; }
  .empty { color: var(--muted); font-size: 14px; }
  .err { color: var(--no); font-size: 13.5px; margin-top: 9px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OutcomeLock</h1>
    <p class="tag">You pay up front. The money waits in escrow until you have read what the agent
      actually produced.</p>
    <div class="tiers" id="tiers"></div>
  </header>

  <div class="card">
    <label for="q">Ask the agent something</label>
    <textarea id="q" placeholder="Explain what a Hedera scheduled transaction is and when it executes."></textarea>
    <div class="row">
      <button id="go">Pay and ask</button>
      <span class="price" id="price"></span>
    </div>
    <div class="err" id="err" hidden></div>
  </div>

  <div class="card">
    <div id="jobs"><p class="empty">No jobs yet.</p></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let priceInfo = null;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadHealth() {
  const h = await (await fetch('/health')).json();
  priceInfo = h;
  $('price').textContent = `${h.price} ${h.asset.symbol} per request · escrow ${h.escrow}`;
  const t = h.tiers || {};
  $('tiers').innerHTML = Object.entries(t).map(([k, v]) =>
    `<span class="chip ${v.degraded ? 'degraded' : ''}">${esc(k)}: ${esc(v.label)}</span>`).join('');
}

function countdown(deadline) {
  const left = deadline - Date.now();
  if (left <= 0) return 'releasing…';
  const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
  return `auto-releases in ${m}m ${String(s).padStart(2, '0')}s`;
}

function jobHtml(j) {
  const trail = (j.evidence || []).map((e) =>
    `<div><b>${esc(e.type)}</b><span>${esc(new Date(e.at).toLocaleTimeString())}</span></div>`).join('');
  const buttons = j.state === 'held'
    ? `<div class="row">
         <button data-act="approve" data-id="${j.id}">Approve — pay the seller</button>
         <button class="ghost" data-act="reject" data-id="${j.id}">Reject — refund me</button>
       </div>`
    : `<div class="meta">${esc(j.decisionReason || '')}${j.decisionTx ? ` · ${esc(j.decisionTx)}` : ''}</div>`;
  return `<div class="job">
    <div class="jobhead">
      <span class="q">${esc(j.question)}</span>
      <span class="state ${j.state}">${j.state}</span>
    </div>
    <div class="meta">${j.amountDisplay} ${esc(j.assetSymbol || '')} · agent ${esc(j.agentVersion || '')}
      · tier ${esc(j.workerTier || '')}</div>
    ${j.state === 'held' ? `<div class="clock" data-deadline="${j.deadline}">${countdown(j.deadline)}</div>` : ''}
    <pre>${esc(j.deliverable || '')}</pre>
    ${buttons}
    <div class="trail">${trail}</div>
  </div>`;
}

async function loadJobs() {
  const list = await (await fetch('/jobs')).json();
  if (!list.length) { $('jobs').innerHTML = '<p class="empty">No jobs yet.</p>'; return; }
  const full = await Promise.all(list.slice(0, 8).map((j) => fetch(`/jobs/${j.id}`).then((r) => r.json())));
  $('jobs').innerHTML = full.map(jobHtml).join('');
}

$('go').addEventListener('click', async () => {
  const question = $('q').value.trim();
  if (!question) return;
  $('go').disabled = true; $('go').textContent = 'Paying…'; $('err').hidden = true;
  try {
    const r = await fetch('/demo/buy', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || `failed (${r.status})`);
    $('q').value = '';
    await loadJobs();
  } catch (e) {
    $('err').textContent = e.message; $('err').hidden = false;
  } finally {
    $('go').disabled = false; $('go').textContent = 'Pay and ask';
  }
});

$('jobs').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-act]');
  if (!b) return;
  b.disabled = true;
  await fetch(`/jobs/${b.dataset.id}/${b.dataset.act}`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ reason: b.dataset.act === 'approve' ? 'looks right' : 'not what I asked for' }),
  });
  await loadJobs();
});

setInterval(() => {
  document.querySelectorAll('.clock[data-deadline]').forEach((el) => {
    el.textContent = countdown(Number(el.dataset.deadline));
  });
}, 1000);
setInterval(loadJobs, 6000);

loadHealth().then(loadJobs);
</script>
</body>
</html>
